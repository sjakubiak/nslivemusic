name: Deploy to Cloudflare

# Builds the site (which runs the event ingest first) and deploys it to
# Cloudflare Workers. Runs on every push to main, every 6 hours to refresh
# events, and on demand: the admin page triggers it after an approval.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip until Cloudflare is set up
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
      - name: Keep venue map positions between runs (spares OpenStreetMap lookups)
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: data/geocode-cache.json
          key: geocode-${{ github.run_id }}
          restore-keys: geocode-
      - name: Ingest events, build and deploy
        if: steps.check.outputs.ready == 'true'
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Read by the ingest step at build time.
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          # Approved regular nights, read from the live site (stored in Cloudflare D1).
          LISTINGS_URL: https://nslivemusic.sjakubiak.workers.dev/api/listings
          SCRAPER_USER_AGENT: "NSLiveMusicFinderBot/1.0 (+https://nslivemusic.onrender.com)"
